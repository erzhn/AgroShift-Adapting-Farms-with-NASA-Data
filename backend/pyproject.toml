# Только настройки инструментов. Зависимости — в requirements*.txt.

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: Depends() в аргументах по умолчанию — стандартный приём FastAPI
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests", "app/modules/farms/tests"]
pythonpath = ["."]
markers = [
    "db: тест требует запущенной PostgreSQL (DATABASE_URL)",
]
